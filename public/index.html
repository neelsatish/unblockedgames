<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Doodle Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4-4 10-10 8 8-6 6Z"/><path d="M22 21H7"/><path d="m5 11 8 8"/></symbol>
      <symbol id="i-bucket" viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m6 6 1 14h10l1-14"/></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path d="m2 7 5 5 5-8 5 8 5-5-2 12H4Z"/></symbol>
      <symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 2 2.3l-1.4 8a2 2 0 0 1-2 1.7H7V10l4-8a3 3 0 0 1 4 3.9Z"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/></symbol>
    </defs>
  </svg>

  <!-- Home -->
  <main id="home" class="screen">
    <div class="home-card card">
      <h1 class="logo">Doodle<span>Dash</span></h1>
      <p class="tagline">Draw it. Guess it. Beat your friends.</p>
      <label class="field">
        <span>Your name</span>
        <input id="name" maxlength="20" autocomplete="nickname" placeholder="e.g. Sam">
      </label>
      <button id="create" class="btn btn-primary btn-big">Create private room</button>
      <div class="divider"><span>or join with a code</span></div>
      <form id="join-form" class="join-row">
        <label class="sr-only" for="code">Room code</label>
        <input id="code" maxlength="5" placeholder="ABCDE" autocomplete="off" spellcheck="false">
        <button class="btn btn-secondary" type="submit">Join</button>
      </form>
      <p id="home-error" class="error" role="alert"></p>
    </div>
  </main>

  <!-- Game -->
  <div id="game" class="screen" hidden>
    <header class="topbar card">
      <div class="timer" aria-label="Time left"><svg class="icon"><use href="#i-clock"/></svg><span id="timer">0</span></div>
      <div class="round" id="round"></div>
      <div class="word" id="word" aria-live="polite"></div>
      <div class="room-code">Room <strong id="room-code"></strong></div>
    </header>

    <aside class="players card" aria-label="Players">
      <ol id="players"></ol>
    </aside>

    <section class="stage">
      <div class="canvas-wrap card">
        <canvas id="canvas" width="800" height="600" aria-label="Drawing board"></canvas>
        <div id="overlay" class="overlay" hidden></div>
      </div>
      <div id="toolbar" class="toolbar card" hidden>
        <div id="palette" class="palette" role="group" aria-label="Colors"></div>
        <div id="sizes" class="sizes" role="group" aria-label="Brush size"></div>
        <div class="tools" role="group" aria-label="Tools">
          <button class="tool active" data-tool="brush" aria-label="Brush (B)" title="Brush (B)"><svg class="icon"><use href="#i-pencil"/></svg></button>
          <button class="tool" data-tool="eraser" aria-label="Eraser (E)" title="Eraser (E)"><svg class="icon"><use href="#i-eraser"/></svg></button>
          <button class="tool" data-tool="fill" aria-label="Fill (F)" title="Fill (F)"><svg class="icon"><use href="#i-bucket"/></svg></button>
          <button class="tool" id="undo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)"><svg class="icon"><use href="#i-undo"/></svg></button>
          <button class="tool" id="clear" aria-label="Clear canvas" title="Clear canvas"><svg class="icon"><use href="#i-trash"/></svg></button>
        </div>
      </div>
      <div id="rating" class="rating" hidden>
        <button class="btn btn-ghost" data-like="1" aria-label="Like this drawing"><svg class="icon"><use href="#i-thumb"/></svg></button>
        <button class="btn btn-ghost" data-like="0" aria-label="Dislike this drawing"><svg class="icon flip"><use href="#i-thumb"/></svg></button>
      </div>
    </section>

    <aside class="chat card" aria-label="Chat">
      <ul id="messages" aria-live="polite"></ul>
      <form id="chat-form">
        <label class="sr-only" for="chat-input">Type your guess</label>
        <input id="chat-input" maxlength="100" autocomplete="off" placeholder="Type your guess here...">
      </form>
    </aside>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
