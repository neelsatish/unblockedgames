<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Unblocked Arcade</title>
  <meta name="description" content="Draw it, guess it, beat your friends. Private rooms with codes.">
  <meta name="theme-color" content="#7C3AED">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237C3AED'/%3E%3Cpath d='M18 44c6-14 10-20 14-20s4 10 8 10 6-6 8-10' stroke='%23FACC15' stroke-width='7' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
      <symbol id="i-eraser" viewBox="0 0 24 24"><path d="m7 21-4-4 10-10 8 8-6 6Z"/><path d="M22 21H7"/><path d="m5 11 8 8"/></symbol>
      <symbol id="i-bucket" viewBox="0 0 24 24"><path d="m19 11-8-8-8.6 8.6a2 2 0 0 0 0 2.8l5.2 5.2a2 2 0 0 0 2.8 0Z"/><path d="m5 2 5 5"/><path d="M2 13h15"/><path d="M22 20a2 2 0 1 1-4 0c0-1.6 1.7-2.4 2-4 .3 1.6 2 2.4 2 4Z"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m6 6 1 14h10l1-14"/></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path d="m2 7 5 5 5-8 5 8 5-5-2 12H4Z"/></symbol>
      <symbol id="i-thumb" viewBox="0 0 24 24"><path d="M7 10v12"/><path d="M15 5.9 14 10h5.8a2 2 0 0 1 2 2.3l-1.4 8a2 2 0 0 1-2 1.7H7V10l4-8a3 3 0 0 1 4 3.9Z"/></symbol>
      <symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="13" height="13" rx="2"/><path d="M4 16V5a2 2 0 0 1 2-2h11"/></symbol>
      <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5a10 10 0 0 1 0 14"/></symbol>
      <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H2v6h4l5 4Z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
      <symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M2 2l20 20"/><path d="M8.5 16.5a5 5 0 0 1 7 0"/><path d="M5 12.9a10 10 0 0 1 5.2-2.8"/><path d="M19 12.9a10 10 0 0 0-2.4-1.7"/><path d="M12 20h.01"/></symbol>
    </defs>
  </svg>

  <div id="banner" class="banner" role="status" hidden></div>

  <!-- Home -->
  <main id="home" class="screen">
    <div class="home-wrap">
      <header class="home-head">
        <h1 class="logo">Unblocked<span>Arcade</span></h1>
        <p class="tagline">Party games with your friends. Make a room, share the code, play.</p>
      </header>

      <section class="profile card" aria-label="Your player">
        <div id="avatar-preview" class="avatar avatar-xl" aria-hidden="true">?</div>
        <div class="you-fields">
          <label class="field">
            <span>Your name</span>
            <input id="name" maxlength="20" autocomplete="nickname" placeholder="e.g. Sam">
          </label>
          <div id="avatar-colors" class="avatar-colors" role="radiogroup" aria-label="Avatar color"></div>
        </div>
      </section>

      <!-- Step 1: pick a game -->
      <section id="game-picker" aria-labelledby="pick-title">
        <h2 id="pick-title" class="section-title">Pick a game</h2>
        <div class="games">
          <button class="game-card card" data-game="doodle">
            <div class="game-art art-doodle" aria-hidden="true">
              <svg viewBox="0 0 120 80"><circle cx="20" cy="20" r="9" class="sun"/><path d="M14 62c12-26 22-36 30-36s8 22 18 22 14-14 20-22 10 6 14 10" class="scribble"/></svg>
            </div>
            <div class="game-body">
              <h3>Doodle Dash</h3>
              <p>One player draws, everyone races to guess the word in chat.</p>
              <div class="tags"><span>2–20 players</span><span>Drawing</span></div>
            </div>
            <span class="play-pill">Play</span>
          </button>
          <a class="game-card card" href="/rare/">
            <div class="game-art art-rare" aria-hidden="true">
              <svg viewBox="0 0 120 80"><rect x="16" y="20" width="26" height="40" rx="6"/><rect x="47" y="12" width="26" height="48" rx="6"/><rect x="78" y="28" width="26" height="32" rx="6"/></svg>
            </div>
            <div class="game-body">
              <h3>Rare Finds</h3>
              <p>Name things in a category. The rarer your answer, the more points.</p>
              <div class="tags"><span>Solo or friends</span><span>Trivia</span></div>
            </div>
            <span class="play-pill">Play</span>
          </a>
        </div>
      </section>

      <!-- Step 2: create or join a room for the chosen game -->
      <section id="room-step" class="room-step card" hidden aria-labelledby="room-title">
        <button id="back" class="btn btn-ghost back-btn" type="button">&larr; All games</button>
        <h2 id="room-title" class="section-title">Doodle Dash</h2>
        <button id="create" class="btn btn-primary btn-big">Create private room</button>
        <div class="divider"><span>or join with a code</span></div>
        <form id="join-form" class="join-row">
          <label class="sr-only" for="code">Room code</label>
          <input id="code" maxlength="5" placeholder="ABCDE" autocomplete="off" spellcheck="false">
          <button class="btn btn-secondary" type="submit">Join</button>
        </form>
        <p id="home-error" class="error" role="alert"></p>
      </section>
    </div>
  </main>

  <!-- Game -->
  <div id="game" class="screen" hidden>
    <header class="topbar card">
      <div class="timer" id="timer-box" aria-label="Time left">
        <svg viewBox="0 0 44 44" class="ring" aria-hidden="true">
          <circle cx="22" cy="22" r="19" class="ring-bg"/>
          <circle cx="22" cy="22" r="19" class="ring-fg" id="ring"/>
        </svg>
        <span id="timer">-</span>
      </div>
      <div class="round" id="round"></div>
      <div class="word-area">
        <div class="word-label" id="word-label"></div>
        <div class="word" id="word" aria-live="polite"></div>
      </div>
      <button id="mute" class="btn btn-ghost icon-btn" aria-label="Mute sounds"><svg class="icon"><use href="#i-sound"/></svg></button>
      <div class="room-code">Room <strong id="room-code"></strong></div>
    </header>

    <aside class="players card" aria-label="Players">
      <ol id="players"></ol>
    </aside>

    <section class="stage">
      <div class="canvas-wrap card" id="canvas-wrap">
        <canvas id="canvas" width="800" height="600" aria-label="Drawing board"></canvas>
        <div id="cursor" class="brush-cursor" hidden></div>
        <div id="overlay" class="overlay" hidden></div>
        <canvas id="confetti" class="confetti" width="800" height="600" aria-hidden="true"></canvas>
      </div>
      <div id="toolbar" class="toolbar card" hidden>
        <div class="current" id="current" aria-hidden="true"><i></i></div>
        <div id="palette" class="palette" role="group" aria-label="Colors"></div>
        <div id="sizes" class="sizes" role="group" aria-label="Brush size"></div>
        <div class="tools" role="group" aria-label="Tools">
          <button class="tool active" data-tool="brush" aria-label="Brush (B)" title="Brush (B)"><svg class="icon"><use href="#i-pencil"/></svg></button>
          <button class="tool" data-tool="eraser" aria-label="Eraser (E)" title="Eraser (E)"><svg class="icon"><use href="#i-eraser"/></svg></button>
          <button class="tool" data-tool="fill" aria-label="Fill (F)" title="Fill (F)"><svg class="icon"><use href="#i-bucket"/></svg></button>
          <button class="tool" id="undo" aria-label="Undo (Ctrl+Z)" title="Undo (Ctrl+Z)"><svg class="icon"><use href="#i-undo"/></svg></button>
          <button class="tool danger" id="clear" aria-label="Clear canvas" title="Clear canvas"><svg class="icon"><use href="#i-trash"/></svg></button>
        </div>
      </div>
      <div id="rating" class="rating" hidden>
        <span>Rate this drawing</span>
        <button class="btn btn-ghost icon-btn" data-like="1" aria-label="Like this drawing"><svg class="icon"><use href="#i-thumb"/></svg></button>
        <button class="btn btn-ghost icon-btn" data-like="0" aria-label="Dislike this drawing"><svg class="icon flip"><use href="#i-thumb"/></svg></button>
      </div>
    </section>

    <aside class="chat card" aria-label="Chat">
      <ul id="messages" aria-live="polite"></ul>
      <form id="chat-form">
        <label class="sr-only" for="chat-input">Type your guess</label>
        <input id="chat-input" maxlength="100" autocomplete="off" placeholder="Type your guess here...">
        <span id="char-count" class="char-count" aria-hidden="true"></span>
      </form>
    </aside>
  </div>

  <div id="menu" class="menu card" role="menu" hidden></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="client.js"></script>
</body>
</html>
